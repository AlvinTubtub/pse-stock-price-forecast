[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecastph-backend"
version = "0.1.0"
description = "ForecastPH forecasting backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3,<2.0",
    "numpy>=1.26,<3.0",
    "pdfplumber>=0.11,<1.0",
    "scikit-learn>=1.4,<2.0",
    "statsmodels>=0.14.6,<1.0",
    "torch>=2.2,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
