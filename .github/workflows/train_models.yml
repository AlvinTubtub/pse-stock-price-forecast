name: PSE Fresh Model Training

on:
  # TEMPORARY PHASE 14 BOOTSTRAP: remove this push trigger before Phase 15
  # cutover to main. Branch and path filters prevent unrelated pushes from
  # launching the expensive all-company fresh-training lifecycle.
  push:
    branches:
      - refactor/backend-from-scratch
    paths:
      - .github/workflows/train_models.yml
      - backend/requirements.txt
      - backend/pyproject.toml
      - backend/scripts/validate_frontend_forecasts.py
      - backend/scripts/validate_production_artifacts.py
      - backend/src/artifacts/production_manifest.py
      - backend/src/export/validation.py
      - backend/src/inference/predictor.py
  schedule:
    - cron: "0 0 3 * *"
  workflow_dispatch: {}

concurrency:
  group: pse-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    name: Train all configured PSE companies
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest -q

      - name: Verify clean backend imports
        working-directory: backend
        run: |
          python - <<'PY'
          import src.models.arima
          import src.models.lag_regression
          import src.models.lstm
          import src.training.train_arima
          import src.training.train_lir
          import src.training.train_lstm
          import src.training.orchestration
          print("clean imports: PASS")
          PY

      - name: Validate raw OHLCV inputs
        working-directory: backend
        run: python scripts/validate_raw.py --all --verbose

      - name: Run complete fresh training lifecycle
        working-directory: backend
        run: python scripts/train_all.py --all --fresh --verbose

      - name: Validate complete fresh artifacts
        working-directory: backend
        run: |
          python scripts/validate_production_artifacts.py \
            --skip-manifest \
            --require-forecasts \
            --require-current-data \
            --verbose

      - name: Validate generated frontend JSON
        working-directory: backend
        run: python scripts/validate_frontend_forecasts.py --verbose

      - name: Create and validate production manifest
        working-directory: backend
        run: |
          python scripts/validate_production_artifacts.py \
            --create-manifest \
            --run-id "${{ github.run_id }}" \
            --source-commit "${{ github.sha }}" \
            --source-branch "${{ github.ref_name }}" \
            --require-forecasts \
            --require-current-data \
            --verbose

      - name: Upload verified production artifact package
        uses: actions/upload-artifact@v4
        with:
          name: forecastph-backend-artifacts
          path: |
            backend/artifacts/models
            backend/artifacts/evaluations
            backend/artifacts/production_manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit frontend forecast data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- frontend/public/forecasts
          if git diff --cached --quiet; then
            echo "No frontend forecast changes to commit."
          else
            git commit -m "Automated fresh model training ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
