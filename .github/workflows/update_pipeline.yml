name: PSE EOD Update and Persisted Model Forecast

on:
  # TEMPORARY PHASE 14 BOOTSTRAP: remove this push trigger before Phase 15
  # cutover to main. It remains dormant until a deliberate follow-up commit
  # adds/changes the marker after a valid training artifact has been created.
  push:
    branches:
      - refactor/backend-from-scratch
    paths:
      - .github/phase14-update-bootstrap.trigger
  repository_dispatch:
    types: [update-pse-data]
  workflow_dispatch: {}

concurrency:
  group: pse-pipeline
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  forecast:
    name: Ingest EOD and forecast from verified persisted models
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Locate latest valid Phase 14 training artifact
        id: production_artifact
        working-directory: backend
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          found=false
          while IFS=$'\t' read -r run_id source_commit; do
            if [ -z "$run_id" ] || [ -z "$source_commit" ]; then
              continue
            fi
            candidate_root="$RUNNER_TEMP/forecastph-artifact-$run_id"
            mkdir -p "$candidate_root"
            if ! gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name forecastph-backend-artifacts \
              --dir "$candidate_root"; then
              echo "Training run $run_id has no downloadable production artifact; checking older runs."
              continue
            fi
            if python scripts/validate_production_artifacts.py \
              --artifacts-root "$candidate_root" \
              --expected-run-id "$run_id" \
              --expected-source-commit "$source_commit" \
              --expected-source-branch "$TARGET_BRANCH" \
              --verbose; then
              echo "artifact_root=$candidate_root" >> "$GITHUB_OUTPUT"
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
              found=true
              break
            fi
            echo "Training run $run_id did not contain a valid Phase 14 package; checking older runs."
          done < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow train_models.yml \
              --branch "$TARGET_BRANCH" \
              --status success \
              --limit 50 \
              --json databaseId,headSha \
              --jq '.[] | [.databaseId, .headSha] | @tsv'
          )
          if [ "$found" != true ]; then
            echo "No valid Phase 14 production model artifact exists. Run PSE Fresh Model Training manually first." >&2
            exit 1
          fi

      - name: Restore verified production artifact layout
        working-directory: backend
        env:
          ARTIFACT_ROOT: ${{ steps.production_artifact.outputs.artifact_root }}
        run: |
          python scripts/reset_artifacts.py --yes
          cp -a "$ARTIFACT_ROOT/." artifacts/

      - name: Validate restored production artifacts
        working-directory: backend
        run: |
          python scripts/validate_production_artifacts.py \
            --expected-run-id "${{ steps.production_artifact.outputs.run_id }}" \
            --expected-source-commit "${{ steps.production_artifact.outputs.source_commit }}" \
            --expected-source-branch "${{ github.ref_name }}" \
            --verbose

      - name: Ingest official PSE EDGE EOD reports
        id: ingestion
        working-directory: backend
        run: |
          python scripts/update_eod.py --verbose
          if git diff --quiet -- data/raw; then
            echo "raw_changed=false" >> "$GITHUB_OUTPUT"
            echo "No new market-session rows were added; persisted inference will not be regenerated."
          else
            echo "raw_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate raw OHLCV inputs
        working-directory: backend
        run: python scripts/validate_raw.py --all --verbose

      - name: Forecast from persisted models without training
        if: steps.ingestion.outputs.raw_changed == 'true'
        working-directory: backend
        run: python scripts/forecast_all.py --all --verbose

      - name: Validate generated frontend JSON
        if: steps.ingestion.outputs.raw_changed == 'true'
        working-directory: backend
        run: python scripts/validate_frontend_forecasts.py --verbose

      - name: Commit raw and forecast data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- backend/data/raw frontend/public/forecasts
          if git diff --cached --quiet; then
            echo "No raw or frontend forecast changes to commit."
          else
            git commit -m "Automated persisted-model forecast ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
